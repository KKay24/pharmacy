services:
  - type: web
    name: pharmacy-backend
    runtime: node
    plan: free
    rootDir: pharmacy-backend/server
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_HOURS
        value: "12"
      - key: ENABLE_DEMO_SEEDING
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: IP_GEO_ENABLED
        value: "true"
      - key: AUTH_AUDIT_RETENTION_DAYS
        value: "90"
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: AI_PROVIDER
        value: "openai"
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: "gpt-4o-mini"
      - key: AI_TIMEOUT_MS
        value: "15000"
      - key: AI_RATE_LIMIT_MAX
        value: "15"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"

databases:
  - name: pharmacy-db
    plan: free
    databaseName: pharmacy
    user: pharmacy
