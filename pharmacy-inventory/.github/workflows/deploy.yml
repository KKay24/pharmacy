name: Deploy to Production

# This workflow automates deployment when code is pushed to main branch
# Uncomment and configure for your needs

on:
  push:
    branches:
      - main
  # Uncomment to enable manual deployment
  # workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test -- --passWithNoTests --watchAll=false
      
      - name: Build application
        run: npm run build
      
      - name: Check build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build folder not found"
            exit 1
          fi
          echo "Build successful"

